<body>
  <main class="hero profile-link">

      <img class="logo" src="/assets/glug-logo-white.png" alt="glug — a hand holding a glass of wine" width="956" height="711">
      <h1 class="tagline">Hoexter's wine list, matched to your taste.</h1>

  <script>
    // Demo for the Hoexter's meeting (30 Oct 2026): opens one saved menu scan.
    // Saved scans are owner-only, so this works only on a phone signed in to the
    // account that saved the scan. Later this URL becomes the attributed waitlist link.
    const SCAN_ID = 'eadb38b4-2f89-4dff-a228-6ad20b757ebf';
    const deepLink = 'glug://scanner/menu/result/' + SCAN_ID;
    document.getElementById('open-in-glug').href = deepLink;
    // Try once on load; the button stays as the fallback.
    window.location.href = deepLink;
  </script>
